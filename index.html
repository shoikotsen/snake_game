<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake Xenzia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{--page:#e9edf0;--lcd:#9a982f;--ink:#3b3320}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#10171c}}
:root[data-theme="dark"]{--page:#10171c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;font-family:system-ui,sans-serif}
.phone{--w:min(94vw,640px,calc((100dvh - 24px)*1.477));width:var(--w);font-size:calc(var(--w)/15.6)}
.bezel{}
.lcd{position:relative;background:var(--lcd);aspect-ratio:96/65;border-radius:.3em;overflow:hidden;box-shadow:inset 0 0 .8em rgba(0,0,0,.45)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.menu,.over{position:absolute;inset:0;background:var(--lcd);color:var(--ink);font:1.4em/1 "VT323","Courier New",monospace;padding:.15em .3em;display:flex;flex-direction:column}
.menu .t{display:flex;justify-content:space-between;height:1em;margin-bottom:.1em}
.row{display:flex;justify-content:space-between;padding:0 .15em;height:1em;white-space:nowrap}
.row.sel{background:var(--ink);color:var(--lcd)}
.soft{margin-top:auto;display:flex;justify-content:space-between;padding:0 .3em;font-weight:bold}
.over{align-items:center;justify-content:center;text-align:center;gap:.3em}
.hide{display:none}
.soft span,.row{cursor:pointer}
</style>
</head>
<body>
<div class="phone"><div class="bezel"><div class="lcd">
  <canvas id="cv" width="96" height="65"></canvas>
  <div class="menu" id="menu"><div class="t"><span>Snake Xenzia</span><span id="lv">1</span></div><div id="rows"></div><div class="soft"><span data-a="select">Select</span><span data-a="back">Back</span></div></div>
  <div class="over hide" id="over"></div>
</div></div></div>

<script>
(function(){
  var ROWS=9,C=5,OY=2,BT=45,COLS=19,OX=0;
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var menuEl=document.getElementById('menu'),rowsEl=document.getElementById('rows'),lvEl=document.getElementById('lv'),overEl=document.getElementById('over');
  var LCD='#9a982f',INK='#3b3320';
  var level=1,type='classic',best=0,screen='menu',inGame=false,cur=0;
  var snake,dir,queue,food,bonus,eaten,score,timer;
  try{best=+localStorage.getItem('xz-best')||0;level=+localStorage.getItem('xz-level')||1;type=localStorage.getItem('xz-type')==='box'?'box':'classic'}catch(e){}
  var V={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  var SEG={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};
  function save(){try{localStorage.setItem('xz-level',level);localStorage.setItem('xz-type',type);localStorage.setItem('xz-best',best)}catch(e){}}

  function items(){return inGame?['Continue','New game','Level','Game type']:['New game','Level','Game type']}
  function render(){
    menuEl.classList.toggle('hide',screen==='game'||screen==='over');
    overEl.classList.toggle('hide',screen!=='over');
    lvEl.textContent=level;
    var list,sel,mark=-1;
    if(screen==='level'){list=[1,2,3,4,5,6,7,8,9].map(function(n){return 'Level '+n});sel=cur;mark=level-1}
    else if(screen==='type'){list=['Classic','Box'];sel=cur;mark=type==='box'?1:0}
    else{list=items();sel=cur}
    var start=Math.max(0,Math.min(sel-1,list.length-4)),h='';
    for(var i=start;i<Math.min(list.length,start+4);i++){
      h+='<div class="row'+(i===sel?' sel':'')+'" data-i="'+i+'"><span>'+list[i]+'</span><span>'+(i===mark?'*':'')+'</span></div>';
    }
    rowsEl.innerHTML=h;
  }
  function setField(){COLS=type==='box'?18:19;OX=type==='box'?3:0}
  function reset(){
    setField();
    snake=[[6,4],[5,4],[4,4],[3,4]];dir='right';queue=[];score=0;eaten=0;bonus=null;food=null;
    food=freeCell(1);draw();
  }
  function used(x,y,w){
    if(snake.some(function(s){return s[0]>=x&&s[0]<x+w&&s[1]>=y&&s[1]<y+w}))return true;
    return !!(food&&food[0]>=x&&food[0]<x+w&&food[1]>=y&&food[1]<y+w);
  }
  function freeCell(w){
    for(var i=0;i<300;i++){
      var x=Math.floor(Math.random()*(COLS-w+1)),y=Math.floor(Math.random()*(ROWS-w+1));
      if(!used(x,y,w))return [x,y];
    }
    return null;
  }
  function delay(){return 210-(level-1)*17}
  function run(){clearInterval(timer);timer=setInterval(tick,delay())}
  function newGame(){reset();inGame=true;screen='game';render();run()}
  function resume(){screen='game';render();run()}
  function pause(){clearInterval(timer);screen='menu';cur=0;render()}
  function steer(d){
    var last=queue.length?queue[queue.length-1]:dir,a=V[last],b=V[d];
    if(a[0]+b[0]===0&&a[1]+b[1]===0)return;
    if(d===last)return;
    if(queue.length<2)queue.push(d);
  }
  function addScore(n){score+=n;if(score>best){best=score;save()}}
  function tick(){
    if(queue.length)dir=queue.shift();
    var h=snake[0],v=V[dir],nx=h[0]+v[0],ny=h[1]+v[1];
    if(type==='classic'){nx=(nx+COLS)%COLS;ny=(ny+ROWS)%ROWS}
    var ateFood=food&&nx===food[0]&&ny===food[1];
    var ateBonus=bonus&&nx>=bonus.x&&nx<bonus.x+2&&ny>=bonus.y&&ny<bonus.y+2;
    var grow=ateFood||ateBonus;
    var body=grow?snake:snake.slice(0,-1);
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS||body.some(function(s){return s[0]===nx&&s[1]===ny}))return over();
    snake.unshift([nx,ny]);
    if(!grow)snake.pop();
    if(bonus){bonus.t--;if(bonus.t<=0)bonus=null}
    if(ateBonus){addScore(level*Math.ceil(5+bonus.t/BT*20));bonus=null}
    if(ateFood){
      addScore(level);eaten++;food=freeCell(1);
      if(eaten%5===0&&!bonus){var p=freeCell(2);if(p)bonus={x:p[0],y:p[1],t:BT}}
    }
    draw();
  }
  function over(){
    clearInterval(timer);inGame=false;draw();screen='over';
    overEl.innerHTML='<div>Game over</div><div>Score: '+score+'</div><div>Best: '+best+'</div>';
    render();
  }
  function px(x,y,w,h){ctx.fillRect(x,y,w,h)}
  function bead(x,y){px(x+1,y,3,5);px(x,y+1,5,3)}
  function digit(n,x,y){
    var q=SEG[n];
    if(q.indexOf('a')>-1)px(x,y,5,1);
    if(q.indexOf('g')>-1)px(x,y+4,5,1);
    if(q.indexOf('d')>-1)px(x,y+8,5,1);
    if(q.indexOf('f')>-1)px(x,y,1,5);
    if(q.indexOf('b')>-1)px(x+4,y,1,5);
    if(q.indexOf('e')>-1)px(x,y+4,1,5);
    if(q.indexOf('c')>-1)px(x+4,y+4,1,5);
  }
  function draw(){
    ctx.fillStyle=LCD;px(0,0,96,65);ctx.fillStyle=INK;
    if(type==='box'){px(0,0,96,2);px(0,0,2,50);px(94,0,2,50);px(0,47,96,3)}
    else px(0,49,96,1);
    var t=('0000'+Math.min(score,9999)).slice(-4);
    for(var i=0;i<4;i++)digit(+t[i],4+i*6,51);
    if(bonus){
      var w=Math.round(46*bonus.t/BT);
      px(44,54,w,4);
      for(var a=w;a<46;a++)for(var b=0;b<4;b++)if((a+b)%2===0)px(44+a,54+b,1,1);
    }
    if(food){var fx=OX+food[0]*C,fy=OY+food[1]*C;px(fx+2,fy+1,1,3);px(fx+1,fy+2,3,1)}
    if(bonus){
      var bx=OX+bonus.x*C,by=OY+bonus.y*C;
      for(var yy=0;yy<10;yy++)for(var xx=0;xx<10;xx++){
        var dx=xx-4.5,dy=yy-4.5;
        if(dx*dx+dy*dy<=22)px(bx+xx,by+yy,1,1);
      }
      ctx.fillStyle=LCD;px(bx+4,by+3,1,1);ctx.fillStyle=INK;
    }
    var n=snake.length;
    for(var k=n-1;k>=0;k--){
      var c=snake[k],x=OX+c[0]*C,y=OY+c[1]*C;
      if(k===0){
        px(x,y,5,5);
        var sn={right:[5,1,1,3],left:[-1,1,1,3],up:[1,-1,3,1],down:[1,5,3,1]}[dir];
        px(x+sn[0],y+sn[1],sn[2],sn[3]);
        ctx.fillStyle=LCD;
        if(dir==='right'){px(x+3,y+1,1,1);px(x+3,y+3,1,1)}
        else if(dir==='left'){px(x+1,y+1,1,1);px(x+1,y+3,1,1)}
        else if(dir==='up'){px(x+1,y+1,1,1);px(x+3,y+1,1,1)}
        else{px(x+1,y+3,1,1);px(x+3,y+3,1,1)}
        ctx.fillStyle=INK;
      }else if(k===n-1){
        var p=snake[k-1],tx=p[0]-c[0],ty=p[1]-c[1];
        if(tx>1)tx=-1;else if(tx<-1)tx=1;
        if(ty>1)ty=-1;else if(ty<-1)ty=1;
        if(tx){px(x,y+2,5,1);px(tx>0?x+2:x,y+1,3,3)}
        else{px(x+2,y,1,5);px(x+1,ty>0?y+2:y,3,3)}
      }else bead(x,y);
    }
  }

  function input(a){
    if(screen==='game'){
      if(V[a])steer(a);else pause();
      return;
    }
    if(screen==='over'){screen='menu';cur=0;render();return}
    if(screen==='menu'){
      var n=items().length;
      if(a==='up'||a==='left')cur=(cur+n-1)%n;
      else if(a==='down'||a==='right')cur=(cur+1)%n;
      else if(a==='back'){if(inGame)resume();return}
      else{
        var it=items()[cur];
        if(it==='Continue')return resume();
        if(it==='New game')return newGame();
        if(it==='Level'){screen='level';cur=level-1}
        else{screen='type';cur=type==='box'?1:0}
      }
      render();return;
    }
    var m=screen==='level'?9:2;
    if(a==='up'||a==='left')cur=(cur+m-1)%m;
    else if(a==='down'||a==='right')cur=(cur+1)%m;
    else if(a==='select'){
      if(screen==='level')level=cur+1;else type=cur===1?'box':'classic';
      save();screen='menu';cur=0;
    }else{screen='menu';cur=0}
    render();
  }
  var map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right','2':'up','8':'down','4':'left','6':'right',Enter:'select','5':'select',' ':'select',Backspace:'back',Escape:'back',p:'back'};
  addEventListener('keydown',function(e){var a=map[e.key];if(a){e.preventDefault();input(a)}});
  Array.prototype.forEach.call(document.querySelectorAll('[data-a]'),function(b){
    b.addEventListener('click',function(){input(b.getAttribute('data-a'));b.blur()});
  });
  var tx=0,ty=0;
  cv.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  cv.addEventListener('touchend',function(e){
    var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20){input('select');return}
    input(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  },{passive:true});

  rowsEl.addEventListener('click',function(e){var r=e.target.closest('.row');if(!r)return;cur=+r.getAttribute('data-i');input('select')});
  overEl.addEventListener('click',function(){input('select')});
  reset();render();
})();
</script>
</body>
</html>
